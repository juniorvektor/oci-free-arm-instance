name: create-vm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency: oci-retry
permissions:
  actions: write

env:
  RETRY_MINUTES: 10   # keep in sync with the cron above

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STACK_ID: ${{ secrets.OCI_STACK_ID }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install and configure OCI CLI
        env:
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          pip install --quiet oci-cli
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF
          oci setup repair-file-permissions --file ~/.oci/config
          oci setup repair-file-permissions --file ~/.oci/key.pem

      - name: Try to create the VPS
        run: |
          notify() {
            jq -n --arg c "$1" '{content: $c}' |
              curl -sS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK" >/dev/null
          }

          # Already done in an earlier run? Turn the workflow off.
          N=$(oci resource-manager job list --stack-id "$STACK_ID" --all \
            --query "length(data[?operation=='APPLY' && \"lifecycle-state\"=='SUCCEEDED'])" --raw-output)
          if [ "$N" -gt 0 ]; then
            gh workflow disable create-vm.yml --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          notify "🚀 Attempt #${{ github.run_number }}: starting apply on the OCI stack…"

          JOB=$(oci resource-manager job create-apply-job --stack-id "$STACK_ID" \
            --execution-plan-strategy AUTO_APPROVED --query 'data.id' --raw-output)
          oci resource-manager job get --job-id "$JOB" \
            --wait-for-state SUCCEEDED --wait-for-state FAILED --max-wait-seconds 1100 >/dev/null || true
          JOB_JSON=$(oci resource-manager job get --job-id "$JOB")
          STATE=$(jq -r '.data."lifecycle-state"' <<<"$JOB_JSON")

          if [ "$STATE" = "SUCCEEDED" ]; then
            notify "✅ **SUCCESS!** Your OCI VPS was created (attempt #${{ github.run_number }}). Retries stopped. $RUN_URL"
            gh workflow disable create-vm.yml --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          # Resource Manager's own failure reason (e.g. TERRAFORM_EXECUTION_ERROR + message)
          FAIL=$(jq -r '.data."failure-details" // {} | [.code, .message] | map(select(. != null and . != "")) | join(": ")' <<<"$JOB_JSON")

          # --query data --raw-output returns the log as plain text instead of a JSON-escaped string
          LOG=$(oci resource-manager job get-job-logs-content --job-id "$JOB" --query data --raw-output 2>&1 || true)
          echo "$LOG" | tail -n 80

          if printf '%s\n%s' "$LOG" "$FAIL" | grep -qi "out of host capacity\|out of capacity"; then
            notify "⏳ Attempt #${{ github.run_number }}: out of capacity. Will retry in ~${RETRY_MINUTES} min."
          else
            # Terraform errors span several lines ("Error: ..." followed by details), so keep some context
            ERR=$(echo "$LOG" | grep -iA4 "error" | grep -v '^--$' | tail -n 15)
            [ -z "$ERR" ] && ERR=$(echo "$LOG" | tail -n 10)
            DETAILS="State: ${STATE:-unknown}"
            [ -n "$FAIL" ] && DETAILS="$DETAILS"$'\n'"Reason: $FAIL"
            [ -n "$ERR" ] && DETAILS="$DETAILS"$'\n'"$ERR"
            # Discord rejects messages over 2000 chars
            DETAILS=$(printf '%s' "$DETAILS" | tail -c 1500)
            notify "❌ Attempt #${{ github.run_number }} failed with a non-capacity error (won't fix itself, check it):"$'\n'"\`\`\`"$'\n'"$DETAILS"$'\n'"\`\`\`"$'\n'"$RUN_URL"
          fi
          exit 1
