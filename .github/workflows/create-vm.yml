name: oci-retry
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency: oci-retry
permissions:
  actions: write

env:
  RETRY_MINUTES: 10   # keep in sync with the cron above

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STACK_ID: ${{ secrets.OCI_STACK_ID }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install and configure OCI CLI
        env:
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          pip install --quiet oci-cli
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF
          oci setup repair-file-permissions --file ~/.oci/config
          oci setup repair-file-permissions --file ~/.oci/key.pem

      - name: Try to create the VPS
        run: |
          notify() {
            jq -n --arg c "$1" '{content: $c}' |
              curl -sS -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK" >/dev/null
          }

          # Already done in an earlier run? Turn the workflow off.
          N=$(oci resource-manager job list --stack-id "$STACK_ID" --all \
            --query "length(data[?operation=='APPLY' && \"lifecycle-state\"=='SUCCEEDED'])" --raw-output)
          if [ "$N" -gt 0 ]; then
            gh workflow disable oci-retry --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          notify "🚀 Attempt #${{ github.run_number }}: starting apply on the OCI stack…"

          JOB=$(oci resource-manager job create-apply-job --stack-id "$STACK_ID" \
            --execution-plan-strategy AUTO_APPROVED --query 'data.id' --raw-output)
          oci resource-manager job get --job-id "$JOB" \
            --wait-for-state SUCCEEDED --wait-for-state FAILED --max-wait-seconds 1100 >/dev/null || true
          STATE=$(oci resource-manager job get --job-id "$JOB" --query 'data."lifecycle-state"' --raw-output)

          if [ "$STATE" = "SUCCEEDED" ]; then
            notify "✅ **SUCCESS!** Your OCI VPS was created (attempt #${{ github.run_number }}). Retries stopped. $RUN_URL"
            gh workflow disable oci-retry --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          LOG=$(oci resource-manager job get-job-logs-content --job-id "$JOB" --raw-output | tail -n 40)
          echo "$LOG"
          if echo "$LOG" | grep -qi "out of host capacity\|out of capacity"; then
            notify "⏳ Attempt #${{ github.run_number }}: out of capacity. Will retry in ~${RETRY_MINUTES} min."
          else
            ERR=$(echo "$LOG" | grep -i "error" | tail -n 3)
            notify "❌ Attempt #${{ github.run_number }} failed with a non-capacity error (won't fix itself, check it): \`\`\`${ERR:-unknown}\`\`\` $RUN_URL"
          fi
          exit 1
